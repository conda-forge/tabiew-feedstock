schema_version: 1

context:
  name: tabiew
  version: "0.16.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/shshemi/tabiew/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e90301e79d0f0e6416e85204ed78d9e80752ca9fff76f9456f3edb9e8de6b8b4

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - pkg-config
  host:
    - openssl

tests:
  - script:
      - tw --version

about:
  homepage: https://github.com/shshemi/tabiew
  repository: https://github.com/shshemi/tabiew
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: A lightweight TUI application to view and query tabular data files
  description: |
    Tabiew is a lightweight, terminal-based application to view and query
    delimiter-separated value formatted documents, such as CSV, TSV, Parquet,
    JSON, JSONL, Arrow, and other tabular data formats.

extra:
  recipe-maintainers:
    - christykanto
    - johanneskoester
